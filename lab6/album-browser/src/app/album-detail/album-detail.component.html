<h2>Album Detail</h2>

<ng-container *ngIf="album; else loadingTpl">
  <p><b>ID:</b> {{ album.id }}</p>
  <p><b>User ID:</b> {{ album.userId }}</p>

  <input [(ngModel)]="album.title" />

  <button class="save" (click)="save()">Save</button>
  <button class="primary" [routerLink]="['/albums', album.id, 'photos']">
    View Photos
  </button>
  <button class="back" routerLink="/albums">Back</button>
</ng-container>

<ng-template #loadingTpl>
  <p>Loading album...</p>
</ng-template>
